<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus</title>
<link rel="stylesheet" href="splash.css">
</head>
<body>
  <div class="win" id="win">
    <div class="drag"></div>
    <div class="body">
      <div class="scr" id="scr">
        <div class="logo">
          <svg viewBox="0 0 64 64" class="lg" aria-hidden="true">
            <path class="ink" pathLength="1" style="--dl:0ms"   d="M20 10H9V54H20"/>
            <path class="ink" pathLength="1" style="--dl:140ms" d="M44 10H55V54H44"/>
            <path class="hot" pathLength="1" style="--dl:340ms" d="M24 22L36 32L24 42"/>
            <rect class="cur" x="38" y="40" width="10" height="5"/>
          </svg>
        </div>
        <div class="wr">
          <div class="ttl" aria-label="NEXUS" id="ttl">
            <span style="--k:0">N</span><span style="--k:1">E</span><span style="--k:2">X</span><span style="--k:3">U</span><span style="--k:4">S</span>
          </div>
          <div class="sub" style="--i:3">SHIP MANAGEMENT</div>
          <div class="bar" style="--i:4"><i id="bf"></i></div>
          <div class="pr" style="--i:4"><span id="ps">Starting</span><b id="pp">0%</b></div>
          <div class="log" id="lg" style="--i:5"></div>
        </div>
      </div>
    </div>
    <div class="ft">
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="ftl">STARTING</span>
      <span class="sp"></span>
      <span id="ver">VERSION</span>
    </div>
    <div class="cover"><b>Ready</b></div>
  </div>
<script src="splash.js"></script>
</body>
</html>
