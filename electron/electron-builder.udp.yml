extends: null
appId: space.nexus-missions.companion-udp
# Display name only: the exe (Nexus.exe), shortcuts and Windows Settings
# entry. v0.9.22 renamed it from "Nexus Companion UDP" now that UDP is the
# standard build.
productName: "Nexus"
# extraMetadata overrides package.json fields in the shipped app. Changing
# the "name" field is how main.js's `app.getName().includes("UDP")` check
# actually reports true at runtime — productName alone doesn't flow into
# app.getName().
#
# KEEP name, appId and the publish channel as they are: name is also the
# settings folder (%APPDATA%\nexus-companion-udp: logins, skins, PTT keys),
# appId groups taskbar icons, and channel "udp" is the udp.yml every
# installed copy checks for updates. Renaming any of them strands users.
extraMetadata:
  name: nexus-companion-udp
npmRebuild: false
files:
  - src/**/*
  - build/icon.*
directories:
  output: dist
publish:
  - provider: generic
    url: https://nexus-missions.space/api/releases/
    channel: udp
win:
  target: nsis
  icon: build/icon.ico
  publisherName: "Nexus Interstellar Traffic System"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Nexus"
  uninstallDisplayName: "Nexus"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  deleteAppDataOnUninstall: false
  runAfterFinish: true
