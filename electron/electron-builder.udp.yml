extends: null
appId: space.nexus-missions.companion-udp
productName: "Nexus Companion UDP"
# extraMetadata overrides package.json fields in the shipped app. Changing
# the "name" field is how main.js's `app.getName().includes("UDP")` check
# actually reports true at runtime — productName alone doesn't flow into
# app.getName().
extraMetadata:
  name: nexus-companion-udp
npmRebuild: false
files:
  - src/**/*
  - build/icon.*
directories:
  output: dist
publish:
  - provider: generic
    url: https://nexus-missions.space/api/releases/
    channel: udp
win:
  target: nsis
  icon: build/icon.ico
  publisherName: "Nexus Interstellar Traffic System"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Nexus Companion UDP"
  uninstallDisplayName: "Nexus Companion UDP — UDP voice test build"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  deleteAppDataOnUninstall: false
  runAfterFinish: true
